name: Builds, tests & co

on:
  - push
  - pull_request

permissions: read-all

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        node-version: [24]
        mobx-version: [6, 7]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tree
        uses: actions/checkout@v4

      - name: Set-up Node.js
        uses: actions/setup-node@v4
        with:
          check-latest: true
          node-version: ${{ matrix.node-version }}

      - run: corepack enable

      - run: pnpm i

      - name: Install MobX ${{ matrix.mobx-version }} for compatibility tests
        run: pnpm add --save-dev mobx@${{ matrix.mobx-version }}

      - run: pnpm ts:check

      - run: pnpm build

      - run: pnpm docs:build

      - run: pnpm test

      - run: pnpm size-limit
